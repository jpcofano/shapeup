<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Semánticos" subtitle="danger, warning e info, por modo (P65)" viewport="700x240" --><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<!-- Valores de src/styles/tokens.css (P105: el kit, igual a la app). -->
<style>
  html,body{margin:0}
  body{background:#0b0c0f;color:#e6e7ea;font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  .wrap{padding:20px;display:flex;flex-direction:column;gap:12px}
  .fila{display:flex;gap:10px;align-items:stretch;padding:12px;border-radius:var(--r-md);background:var(--bg);color:var(--fg)}
  .tit{width:96px;font:var(--fw-semibold) 12px/1.3 var(--font-sans);color:var(--fg);align-self:center}
  .tit small{display:block;font-weight:400;color:var(--muted)}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:40px;border-radius:var(--r-sm);border:1px solid var(--border)}
  .nm{font:var(--fw-semibold) 11px/1.2 var(--font-sans)}
  .hex{font:var(--fw-regular) 11px/1.2 var(--font-sans);color:var(--muted);font-variant-numeric:tabular-nums}
  .nota{font-size:12px;color:#9aa4b2;margin:0}
</style></head><body><div class="wrap">
<div class="fila" data-theme="ion" data-mode="dark"><div class="tit">Oscuro<small>los 5 temas</small></div><div class="sw"><div class="chip" style="background:var(--card);display:grid;place-items:center;color:var(--danger);font-weight:700">Aa</div><div class="nm">danger</div><div class="hex">#f87171</div></div><div class="sw"><div class="chip" style="background:var(--card);display:grid;place-items:center;color:var(--warning);font-weight:700">Aa</div><div class="nm">warning</div><div class="hex">#fbbf24</div></div><div class="sw"><div class="chip" style="background:var(--card);display:grid;place-items:center;color:var(--info);font-weight:700">Aa</div><div class="nm">info</div><div class="hex">#60a5fa</div></div></div>
<div class="fila" data-theme="ion" data-mode="light"><div class="tit">Claro<small>los 5 temas</small></div><div class="sw"><div class="chip" style="background:var(--card);display:grid;place-items:center;color:var(--danger);font-weight:700">Aa</div><div class="nm">danger</div><div class="hex">#b42318</div></div><div class="sw"><div class="chip" style="background:var(--card);display:grid;place-items:center;color:var(--warning);font-weight:700">Aa</div><div class="nm">warning</div><div class="hex">#92400e</div></div><div class="sw"><div class="chip" style="background:var(--card);display:grid;place-items:center;color:var(--info);font-weight:700">Aa</div><div class="nm">info</div><div class="hex">#1d4ed8</div></div></div>
<p class="nota">En claro son más oscuros, para pasar AA como texto. Cada uno tiene su <code>-dim</code> para fondos.</p>
</div></body></html>
