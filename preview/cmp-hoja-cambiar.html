<!-- Recreada como está construida (P105): el marcado sale de renderizar src/components/entrenar/HojaCambiar.tsx
     con datos inventados, y los estilos son las reglas de src/index.css que usa. -->
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0}
  a{color:inherit}
  button{font-family:inherit}
  body{background:#0b0c0f;color:var(--fg);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  .wrap{display:flex;gap:16px;padding:16px;align-items:flex-start;flex-wrap:wrap}
  .col{width:360px;background:var(--bg);color:var(--fg);border-radius:var(--r-lg);padding:16px;box-sizing:border-box;font-family:var(--font-sans)}
  .etq{font:var(--fw-semibold) 11px/1.2 var(--font-sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px}
  .marco{position:relative}
  /* Las hojas son fixed en la app; en la tarjeta se muestran en su lugar. */
  .marco .modal-backdrop{position:relative;inset:auto;min-height:0;background:transparent}
.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px 24px;
  font-size: 14px;
  cursor: pointer;
  width: 100%;
  transition: border-color 0.15s, color 0.15s;
}
.btn-secondary:hover { border-color: var(--muted); color: var(--fg); }
.filter-chip {
  flex-shrink: 0;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.filter-chip:hover { border-color: var(--muted); color: var(--fg); }
.filter-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.72);
  z-index: 200;
  display: flex;
  align-items: flex-end;
}
.modal-sheet {
  background: var(--card);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  width: 100%;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 15px;
  flex-shrink: 0;
}
.modal-close {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  padding: 2px 6px;
}
.modal-close:hover { color: var(--fg); }
.fin-saltado .btn-secondary { width: auto; padding: 8px 14px; }
.paso-carga-body .filter-chip { min-height: 44px; min-width: 52px; font-size: 15px; }
.hoja-salida > .btn-secondary { min-height: 48px; }
