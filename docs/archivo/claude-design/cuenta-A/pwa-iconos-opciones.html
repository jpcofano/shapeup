<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#1a1d24;font-family:system-ui;padding:24px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;max-width:1100px;margin:0 auto}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
img{width:150px;height:150px;border-radius:22%;display:block;box-shadow:0 8px 24px rgba(0,0,0,.4)}
figcaption{font:600 12px/1.3 system-ui;color:#e8ecf1;text-align:center}
.sub{font-weight:400;color:#9aa4b2;font-size:11px}
.home{display:flex;gap:8px;margin-top:6px}
.home img{width:48px;height:48px;border-radius:24%;box-shadow:none}
h2{color:#e8ecf1;font:600 14px/1 system-ui;max-width:1100px;margin:0 auto 16px}
</style></head><body>
<h2>ShapeUp · 10 opciones de ícono de app (revisá a tamaño grande + a 48px como en la home)</h2>
<div class="grid">
<figure><img src="assets/pwa-options/v01-ion-solid.png"><figcaption>V1 · Ion sólido<br><span class="sub">cian + chevron oscuro (actual)</span></figcaption></figure>
<figure><img src="assets/pwa-options/v02-dark-cian.png"><figcaption>V2 · Oscuro/cian<br><span class="sub">inverso, chevron cian</span></figcaption></figure>
<figure><img src="assets/pwa-options/v03-grad-cian-indigo.png"><figcaption>V3 · Gradiente<br><span class="sub">cian→indigo</span></figcaption></figure>
<figure><img src="assets/pwa-options/v04-volt-solid.png"><figcaption>V4 · Volt<br><span class="sub">verde original</span></figcaption></figure>
<figure><img src="assets/pwa-options/v05-dark-grad-chevron.png"><figcaption>V5 · Chevron gradiente<br><span class="sub">oscuro + cian→verde</span></figcaption></figure>
<figure><img src="assets/pwa-options/v06-single-chevron.png"><figcaption>V6 · Chevron único<br><span class="sub">un solo galón, simple</span></figcaption></figure>
<figure><img src="assets/pwa-options/v07-triple-cian.png"><figcaption>V7 · Triple<br><span class="sub">3 galones, dinámico</span></figcaption></figure>
<figure><img src="assets/pwa-options/v08-ion-fill.png"><figcaption>V8 · Chevron lleno<br><span class="sub">sólido, más peso</span></figcaption></figure>
<figure><img src="assets/pwa-options/v09-cian-floor.png"><figcaption>V9 · Con base<br><span class="sub">chevron + suelo</span></figcaption></figure>
<figure><img src="assets/pwa-options/v10-dark-glow.png"><figcaption>V10 · Glow<br><span class="sub">oscuro + brillo cian</span></figcaption></figure>
</div>
<h2 style="margin-top:32px">A 48px (tamaño real en la pantalla de inicio)</h2>
<div class="home" style="max-width:1100px;margin:0 auto">
<img src="assets/pwa-options/v01-ion-solid.png"><img src="assets/pwa-options/v02-dark-cian.png"><img src="assets/pwa-options/v03-grad-cian-indigo.png"><img src="assets/pwa-options/v04-volt-solid.png"><img src="assets/pwa-options/v05-dark-grad-chevron.png"><img src="assets/pwa-options/v06-single-chevron.png"><img src="assets/pwa-options/v07-triple-cian.png"><img src="assets/pwa-options/v08-ion-fill.png"><img src="assets/pwa-options/v09-cian-floor.png"><img src="assets/pwa-options/v10-dark-glow.png">
</div>
</body></html>
