<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%}
  .tile{width:1280px;height:854px;display:flex;overflow:hidden}
  .main{flex:1;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px}
  .main svg{width:300px;height:300px}
  .name{font:var(--fw-heavy) 132px/1 var(--font-sans);letter-spacing:-0.03em;color:var(--fg)}
  .name b{color:var(--accent)}
  .strip{width:150px;display:flex;flex-direction:column}
  .strip span{flex:1}
</style>
</head>
<body>
<div class="tile">
  <div class="main">
    <svg viewBox="0 0 120 120" fill="none"><g stroke="var(--accent)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M30 60 L60 33 L90 60"></path><path d="M30 87 L60 60 L90 87"></path></g></svg>
    <div class="name">Shape<b>Up</b></div>
  </div>
  <div class="strip">
    <span style="background:#4ade80"></span>
    <span style="background:#22d3ee"></span>
    <span style="background:#ff7a45"></span>
    <span style="background:#fb3b53"></span>
  </div>
</div>
</body>
</html>
